<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>College Transport Information System</title>

<style>
body{
    margin:0;
    font-family:'Segoe UI',Arial;
    background:#ffffff;
    color:#1b5e20;
}

/* HEADER */
header{
    background:#1b5e20;
    color:white;
    padding:22px;
    text-align:center;
    font-size:26px;
    font-weight:600;
    letter-spacing:1px;
    box-shadow:0 3px 10px rgba(0,0,0,0.1);
}

/* TOP BUS */
.top-bus{
    text-align:center;
    font-size:60px;
    margin-top:25px;
    animation:floatBus 2s ease-in-out infinite;
}

@keyframes floatBus{
    0%{transform:translateY(0px);}
    50%{transform:translateY(-6px);}
    100%{transform:translateY(0px);}
}

/* MAIN CONTAINER */
.container{
    max-width:950px;
    margin:40px auto;
    margin-left:220px;
    padding:35px;
    background:#f9fdf9;
    border-radius:18px;
    box-shadow:0 8px 25px rgba(0,0,0,0.08);
}

h3{
    color:#2e7d32;
    margin-top:20px;
    font-weight:600;
}

select,button{
    width:100%;
    padding:13px;
    margin-top:10px;
    border-radius:8px;
    font-size:15px;
}

/* SELECT */
select{
    background:#ffffff;
    border:1px solid #a5d6a7;
    color:#1b5e20;
}

/* BUTTON */
button{
    background:#2e7d32;
    color:white;
    font-weight:600;
    border:none;
    cursor:pointer;
    transition:0.3s ease;
}

button:hover{
    background:#1b5e20;
    transform:scale(1.03);
}

/* SHIFT */
.shift{
    display:flex;
    gap:15px;
}

.bus-check{
    flex:1;
    background:#e8f5e9;
    padding:12px;
    border-radius:25px;
    text-align:center;
    cursor:pointer;
    border:1px solid #a5d6a7;
    transition:0.3s;
}

.bus-check.active{
    background:#2e7d32;
    color:white;
    border:none;
}

/* LOADING SCREEN */
#loading{
    display:none;
    position:fixed;
    inset:0;
    background:#ffffff;
    z-index:999;
    overflow:hidden;
}

.road{
    position:absolute;
    bottom:0;
    width:100%;
    height:170px;
    background:#2e7d32;
    z-index:1;
}

.road::before{
    content:"";
    position:absolute;
    top:80px;
    width:100%;
    height:10px;
    background:repeating-linear-gradient(
        to right,
        #ffffff 0px,
        #ffffff 50px,
        transparent 50px,
        transparent 100px
    );
}

.big-bus{
    position:absolute;
    bottom:140px;
    font-size:120px;
    z-index:3;
    animation:drive 5s linear forwards;
}

.smoke{
    position:absolute;
    bottom:180px;
    font-size:40px;
    z-index:2;
    animation:smokeMove 5s linear forwards;
}

.tree{
    position:absolute;
    bottom:170px;
    font-size:50px;
    animation:breeze 2s ease-in-out infinite alternate;
}

.tree:nth-child(1){left:8%;}
.tree:nth-child(2){left:25%;}
.tree:nth-child(3){left:50%;}
.tree:nth-child(4){left:75%;}
.tree:nth-child(5){left:90%;}

@keyframes drive{
    from{left:-200px;}
    to{left:110%;}
}

@keyframes smokeMove{
    from{left:-220px;opacity:1;}
    to{left:85%;opacity:0;}
}

@keyframes breeze{
    from{transform:rotate(-3deg);}
    to{transform:rotate(3deg);}
}

/* RESULT PAGE */
#result{
    display:none;
    margin-top:20px;
}

.bus-card{
    background:#2e7d32;
    color:white;
    padding:22px;
    border-radius:35px;
    text-align:center;
    font-weight:600;
    margin-bottom:25px;
    font-size:17px;
    box-shadow:0 6px 15px rgba(0,0,0,0.1);
}

.map{
    background:#f1f8f4;
    padding:20px;
    border-radius:10px;
    text-align:center;
}

.stop{
    display:inline-block;
    background:#66bb6a;
    color:white;
    padding:10px 16px;
    border-radius:20px;
    margin:6px;
    font-size:14px;
}

.arrow{
    margin:0 6px;
    font-size:18px;
    color:#2e7d32;
}
</style>
</head>

<body>

<header>
R.M.K Group of Institution 🚌 Campus Transit Hub
</header>

<div class="top-bus">🚌</div>

<div class="container" id="formPage">

<!-- BUS SHIFT FIRST -->
<h3>Bus Shift</h3>
<div class="shift">
    <div class="bus-check active" onclick="setShift(this)">Morning</div>
    <div class="bus-check" onclick="setShift(this)">Evening</div>
</div>

<!-- INSTITUTION SECOND -->
<h3>Institution</h3>
<select id="institution">
    <option>R.M.K Engineering College</option>
    <option>R.M.D Engineering College</option>
    <option>R.M.K College of Technology</option>
</select>

<h3>Departure From</h3>
<select id="from">
    <option>Institution</option>
    <option>City Center</option>
    <option>Railway Station</option>
    <option>MKB Nagar</option>
</select>

<h3>Arrival To</h3>
<select id="to">
    <option>Institution</option>
    <option>City Center</option>
    <option>Railway Station</option>
    <option>MKB Nagar</option>
</select>

<button onclick="startLoading()">Find Bus Route</button>

</div>

<div id="loading">
    <div class="tree">🌳</div>
    <div class="tree">🌳</div>
    <div class="tree">🌳</div>
    <div class="tree">🌳</div>
    <div class="tree">🌳</div>

    <div class="smoke">💨💨💨</div>
    <div class="big-bus">🚌</div>
    <div class="road"></div>
</div>

<div class="container" id="result">
    <div class="bus-card">
        🚌 Route No: 101 | Timing: 7:30 AM <br>
        Total Seat Availability : 50 Seats
    </div>
    <div class="map" id="map"></div>
</div>

<script>
function setShift(el){
    document.querySelectorAll('.bus-check').forEach(b=>b.classList.remove('active'));
    el.classList.add('active');
}

function playClick(){
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type="triangle";
    osc.frequency.setValueAtTime(500, ctx.currentTime);
    gain.gain.setValueAtTime(0.3, ctx.currentTime);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime+0.1);
}

function startLoading(){
    playClick();
    document.getElementById("formPage").style.display="none";
    document.getElementById("loading").style.display="block";

    setTimeout(()=>{
        document.getElementById("loading").style.display="none";
        showResult();
    },3000);
}

function showResult(){
    document.getElementById("result").style.display="block";

    const from=document.getElementById("from").value;
    const to=document.getElementById("to").value;

    const path=[from,"Railway Station","MKB Nagar",to];
    const map=document.getElementById("map");
    map.innerHTML="";

    path.forEach((p,i)=>{
        map.innerHTML+=`<span class="stop">${p}</span>`;
        if(i<path.length-1) map.innerHTML+=`<span class="arrow">➡️</span>`;
    });
}
</script>

</body>
</html>
